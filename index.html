<style>
  :root{
    --bg:#F7F4EE;
    --surface:#FFFFFF;
    --text:#1D211E;
    --muted:#8B9089;
    --line:#E9E3D9;
    --check-line:#CFC8BC;
    --accent:#6C8F73;
    --accent-ink:#4A6B52;
    --accent-soft:#E9EFE8;
    --on-accent:#FFFFFF;
    --toast-bg:#1D211E;
    --toast-text:#FFFFFF;
    --toast-action:#A9CFB2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111312;
      --surface:#1A1D1B;
      --text:#ECEDE8;
      --muted:#8E948D;
      --line:#282D29;
      --check-line:#3C433D;
      --accent:#8CB795;
      --accent-ink:#A6CBAD;
      --accent-soft:#1F2C23;
      --on-accent:#101613;
      --toast-bg:#262B27;
      --toast-text:#F1F2ED;
      --toast-action:#A9CFB2;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;padding:0;overflow:hidden}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans CJK KR","Noto Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif;
    font-size:16px;
    line-height:1.45;
    letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  button:active{transform:scale(.97)}

  .app{
    position:fixed;
    left:0;right:0;
    top:var(--app-top,0px);
    height:var(--app-h,100dvh);
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top);
    overflow:hidden;
  }

  /* ── header ── */
  .hd{flex:0 0 auto;padding:8px 18px 0}
  .hd-top{display:flex;align-items:center;justify-content:space-between;min-height:30px}
  .hd-year{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .today-btn{
    border:1px solid var(--line);background:transparent;color:var(--accent-ink);
    font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;
    transition:opacity .2s,color .2s;
  }
  .today-btn.is-current{color:var(--muted);opacity:.55;pointer-events:none}

  .hd-date{display:flex;align-items:center;gap:4px;margin:0 0 12px}
  .date-chip{
    flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:7px;
    position:relative;padding:2px 4px;border-radius:12px;
  }
  .dt{font-size:29px;font-weight:700;letter-spacing:-0.035em;white-space:nowrap}
  .wd{font-size:14.5px;font-weight:500;color:var(--muted);white-space:nowrap}
  .date-input{
    position:absolute;inset:0;width:100%;height:100%;
    opacity:0;border:0;padding:0;margin:0;background:transparent;
    font-size:16px;-webkit-appearance:none;appearance:none;
  }
  .nav-btn{
    flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;
    border:0;background:transparent;color:var(--muted);border-radius:12px;
    transition:background-color .15s;
  }
  .nav-btn:active{background:var(--line)}

  /* ── progress ── */
  .prog{padding-bottom:13px}
  .prog-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
  .prog-label{font-size:12.5px;color:var(--muted)}
  .prog-label.all-done{color:var(--accent-ink);font-weight:600}
  .prog-pct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:5px;border-radius:999px;background:var(--line);overflow:hidden}
  .bar i{
    display:block;height:100%;width:0;border-radius:999px;background:var(--accent);
    transition:width .38s cubic-bezier(.22,.8,.24,1);
  }

  /* ── scroll area ── */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:0 14px 14px;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ── carry over ── */
  .carry{
    display:flex;align-items:center;gap:10px;
    background:var(--accent-soft);
    border-radius:14px;padding:11px 12px 11px 14px;margin:2px 0 12px;
    animation:rowIn .3s ease both;
  }
  .carry-text{flex:1 1 auto;font-size:13px;line-height:1.35;color:var(--accent-ink)}
  .carry-text b{font-weight:700}
  .carry-btn{
    flex:0 0 auto;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);
    font-size:12.5px;font-weight:700;padding:7px 13px;white-space:nowrap;
  }

  /* ── task list ── */
  .list{list-style:none;margin:0;padding:0}
  .task{
    display:flex;align-items:flex-start;gap:11px;
    padding:11px 2px 11px 4px;
    border-bottom:1px solid var(--line);
  }
  .task:last-child{border-bottom:0}
  .task.new{animation:rowIn .26s ease both}
  @keyframes rowIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

  .check{
    flex:0 0 auto;width:24px;height:24px;margin-top:1px;padding:0;
    border-radius:50%;border:1.6px solid var(--check-line);background:transparent;
    display:grid;place-items:center;
    transition:border-color .2s ease,background-color .2s ease;
  }
  .check::after{
    content:"";width:10px;height:5.5px;margin-top:-1px;
    border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);
    border-radius:1px;
    transform:rotate(-45deg) scale(.4);opacity:0;
    transition:transform .18s ease,opacity .18s ease;
  }
  .task.done .check{background:var(--accent);border-color:var(--accent)}
  .task.done .check::after{opacity:1;transform:rotate(-45deg) scale(1)}

  .task-text{
    flex:1 1 auto;min-width:0;padding-top:1px;
    font-size:16px;line-height:1.42;word-break:keep-all;overflow-wrap:anywhere;
    text-decoration:line-through;
    text-decoration-color:transparent;
    text-decoration-thickness:1.4px;
    transition:text-decoration-color .3s ease,color .3s ease;
    -webkit-user-select:none;user-select:none;
  }
  .task.done .task-text{text-decoration-color:currentColor;color:var(--muted)}

  .edit-input{
    flex:1 1 auto;min-width:0;
    font:inherit;font-size:16px;line-height:1.42;
    padding:5px 9px;margin:-4px 0;
    border:1px solid var(--accent);border-radius:10px;
    background:var(--surface);color:var(--text);
    outline:none;
    -webkit-user-select:text;user-select:text;
  }

  .act{
    flex:0 0 auto;width:32px;height:32px;margin-top:-3px;padding:0;
    display:grid;place-items:center;border:0;border-radius:9px;
    background:transparent;color:var(--muted);opacity:.8;
    transition:opacity .15s,background-color .15s;
  }
  .act:active{background:var(--line);opacity:1}
  .act.del:active{color:#B4685F}
  @media (hover:hover){
    .task:hover .act{opacity:.55;color:var(--muted)}
    .task:hover .act.del{color:#B4685F}
    .act:hover{opacity:1}
  }

  .divider{
    display:flex;align-items:center;gap:10px;
    list-style:none;padding:18px 2px 7px;
    font-size:11.5px;color:var(--muted);letter-spacing:.02em;
  }
  .divider::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}

  /* ── empty ── */
  .empty{padding:46px 20px 30px;text-align:center;color:var(--muted);animation:rowIn .3s ease both}
  .empty svg{opacity:.45;margin-bottom:14px}
  .empty p{margin:0;font-size:13.5px;line-height:1.6}
  .empty p.sub{margin-top:4px;font-size:12.5px;opacity:.8}

  /* ── add bar ── */
  .addbar{
    flex:0 0 auto;position:relative;z-index:5;
    display:flex;align-items:center;gap:9px;
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    background:var(--bg);
  }
  .addbar::before{
    content:"";position:absolute;left:0;right:0;top:-26px;height:26px;
    background:linear-gradient(to bottom,transparent,var(--bg));
    pointer-events:none;
  }
  .add-input{
    flex:1 1 auto;min-width:0;
    font:inherit;font-size:16px;
    padding:12px 15px;
    border:1px solid var(--line);border-radius:14px;
    background:var(--surface);color:var(--text);
    outline:none;-webkit-appearance:none;appearance:none;
    transition:border-color .18s,box-shadow .18s;
  }
  .add-input::placeholder{color:var(--muted)}
  .add-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .add-btn{
    flex:0 0 auto;width:46px;height:46px;padding:0;
    display:grid;place-items:center;
    border:0;border-radius:14px;
    background:var(--accent);color:var(--on-accent);
    transition:opacity .18s,transform .12s;
  }
  .add-btn:active{transform:scale(.94)}

  /* ── toast ── */
  .toast{
    position:fixed;left:50%;z-index:30;
    bottom:calc(88px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px;
    max-width:calc(100% - 32px);
    padding:11px 15px 11px 17px;border-radius:999px;
    background:var(--toast-bg);color:var(--toast-text);
    font-size:13.5px;line-height:1.2;
    box-shadow:0 8px 24px rgba(0,0,0,.16);
    opacity:0;transform:translate(-50%,14px);pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast button{
    flex:0 0 auto;border:0;background:transparent;padding:0;
    font-size:13.5px;font-weight:700;color:var(--toast-action);
  }
  .toast button[hidden]{display:none}

  @media (min-width:560px){
    body{background:#EFEBE3}
    .app{left:50%;right:auto;width:430px;margin-left:-215px;box-shadow:0 0 0 1px var(--line)}
  }
  @media (min-width:560px) and (prefers-color-scheme:dark){
    body{background:#0B0D0C}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-top">
      <span class="hd-year" id="yearText">2026년</span>
      <button class="today-btn" id="todayBtn" type="button">오늘</button>
    </div>
    <div class="hd-date">
      <button class="nav-btn" id="prevBtn" type="button" aria-label="이전 날">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <label class="date-chip" id="dateChip">
        <span class="dt" id="dateText">1월 1일</span>
        <span class="wd" id="weekdayText">목요일</span>
        <input class="date-input" type="date" id="datePicker" aria-label="날짜 선택">
      </label>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="다음 날">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
      </button>
    </div>
    <div class="prog">
      <div class="prog-line">
        <span class="prog-label" id="progLabel">할 일을 적어보세요</span>
        <span class="prog-pct" id="progPct"></span>
      </div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
  </header>

  <main class="scroll" id="scroll">
    <div class="carry" id="carry" hidden>
      <div class="carry-text" id="carryText"></div>
      <button class="carry-btn" id="carryBtn" type="button">가져오기</button>
    </div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="24" cy="24" r="16.5"/>
        <path d="M17 24.4l4.8 4.6L31.4 19"/>
      </svg>
      <p id="emptyTitle">아직 적은 할 일이 없어요</p>
      <p class="sub" id="emptySub">아래에 적고 하나씩 체크해 보세요</p>
    </div>
  </main>

  <form class="addbar" id="addForm" autocomplete="off">
    <input class="add-input" id="addInput" type="text" placeholder="할 일을 적어보세요"
           enterkeyhint="done" maxlength="200" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="새 할 일">
    <button class="add-btn" id="addBtn" type="submit" aria-label="추가">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
    </button>
  </form>
</div>

<div class="toast" id="toast" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="undoBtn" type="button" hidden>실행취소</button>
</div>

<noscript>
  <p style="padding:24px;text-align:center">이 앱을 쓰려면 브라우저에서 자바스크립트를 켜 주세요.</p>
</noscript>

<script>
(function () {
  'use strict';

  var KEY = 'daily-todo.v1';
  var WD = ['일', '월', '화', '수', '목', '금', '토'];

  /* ── date helpers ── */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateOf(iso) {
    var p = iso.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function shift(iso, n) {
    var d = dateOf(iso);
    d.setDate(d.getDate() + n);
    return isoOf(d);
  }
  function todayISO() { return isoOf(new Date()); }
  function mdLabel(iso) {
    var d = dateOf(iso);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ── dom ── */
  function $(id) { return document.getElementById(id); }
  var el = {
    year: $('yearText'), date: $('dateText'), wd: $('weekdayText'), picker: $('datePicker'),
    today: $('todayBtn'), prev: $('prevBtn'), next: $('nextBtn'),
    progLabel: $('progLabel'), progPct: $('progPct'), bar: $('barFill'),
    list: $('list'), empty: $('empty'), emptyTitle: $('emptyTitle'), emptySub: $('emptySub'),
    carry: $('carry'), carryText: $('carryText'), carryBtn: $('carryBtn'),
    form: $('addForm'), input: $('addInput'), addBtn: $('addBtn'),
    toast: $('toast'), toastMsg: $('toastMsg'), undo: $('undoBtn'),
    scroll: $('scroll')
  };

  var ICON_PENCIL = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.83 2.83 0 0 0-4-4L4 16v4z"/></svg>';
  var ICON_TRASH = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M6.5 7l.8 12.2h9.4L17.5 7"/></svg>';

  /* ── state ── */
  var store = { v: 1, tasks: {} };
  var view = todayISO();
  var editingId = null;
  var newIds = Object.create(null);
  var reorderTimer = null;
  var toastTimer = null;
  var undoCb = null;
  var composing = false;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return;
      var src = data.tasks;
      if (!src || typeof src !== 'object') return;
      var out = {};
      Object.keys(src).forEach(function (k) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(src[k])) return;
        out[k] = src[k].filter(function (t) {
          return t && typeof t.text === 'string' && t.text.length;
        }).map(function (t) {
          return {
            id: typeof t.id === 'string' && t.id ? t.id : uid(),
            text: t.text,
            done: !!t.done,
            doneAt: typeof t.doneAt === 'number' ? t.doneAt : null,
            createdAt: typeof t.createdAt === 'number' ? t.createdAt : Date.now()
          };
        });
        if (!out[k].length) delete out[k];
      });
      store = { v: 1, tasks: out };
    } catch (e) { /* first run or blocked storage */ }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
    } catch (e) {
      toast('저장하지 못했어요. 사파리 저장 공간을 확인해 주세요', null);
    }
  }

  function tasksOf(d) { return store.tasks[d] || []; }
  function ensure(d) {
    if (!store.tasks[d]) store.tasks[d] = [];
    return store.tasks[d];
  }
  function isEmptyDay(d) { return !store.tasks[d] || !store.tasks[d].length; }

  /* ── render ── */
  function renderHeader() {
    var d = dateOf(view);
    el.date.textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
    el.wd.textContent = WD[d.getDay()] + '요일';
    el.year.textContent = d.getFullYear() + '년';
    if (el.picker.value !== view) el.picker.value = view;
    var isToday = view === todayISO();
    el.today.classList.toggle('is-current', isToday);
    el.today.textContent = isToday ? '오늘' : '오늘로';
    el.today.setAttribute('aria-disabled', isToday ? 'true' : 'false');
  }

  function renderProgress() {
    var list = tasksOf(view);
    var total = list.length;
    var done = 0;
    for (var i = 0; i < list.length; i++) if (list[i].done) done++;
    var pct = total ? Math.round((done / total) * 100) : 0;
    el.bar.style.width = pct + '%';
    if (!total) {
      el.progLabel.textContent = '할 일을 적어보세요';
      el.progLabel.classList.remove('all-done');
      el.progPct.textContent = '';
      return;
    }
    if (done === total) {
      el.progLabel.textContent = '모두 끝냈어요';
      el.progLabel.classList.add('all-done');
    } else {
      el.progLabel.textContent = '완료 ' + done + ' / ' + total;
      el.progLabel.classList.remove('all-done');
    }
    el.progPct.textContent = pct + '%';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function rowHTML(t) {
    var editing = editingId === t.id;
    var cls = 'task' + (t.done ? ' done' : '') + (newIds[t.id] ? ' new' : '');
    var h = '<li class="' + cls + '" data-id="' + esc(t.id) + '">';
    h += '<button class="check" type="button" role="checkbox" aria-checked="' + (t.done ? 'true' : 'false') + '" aria-label="완료 표시"></button>';
    if (editing) {
      h += '<input class="edit-input" type="text" value="' + esc(t.text) + '" maxlength="200" aria-label="할 일 수정">';
    } else {
      h += '<span class="task-text">' + esc(t.text) + '</span>';
      h += '<button class="act edit" type="button" aria-label="수정">' + ICON_PENCIL + '</button>';
      h += '<button class="act del" type="button" aria-label="삭제">' + ICON_TRASH + '</button>';
    }
    return h + '</li>';
  }

  function renderList() {
    var list = tasksOf(view);
    var todo = [], done = [];
    for (var i = 0; i < list.length; i++) (list[i].done ? done : todo).push(list[i]);
    var html = '';
    for (var j = 0; j < todo.length; j++) html += rowHTML(todo[j]);
    if (done.length) {
      html += '<li class="divider">완료 ' + done.length + '</li>';
      for (var k = 0; k < done.length; k++) html += rowHTML(done[k]);
    }
    el.list.innerHTML = html;
    newIds = Object.create(null);

    var empty = list.length === 0;
    el.empty.hidden = !empty;
    if (empty) {
      var isToday = view === todayISO();
      el.emptyTitle.textContent = isToday ? '아직 적은 할 일이 없어요' : '이 날에는 할 일이 없어요';
      el.emptySub.textContent = isToday ? '아래에 적고 하나씩 체크해 보세요' : '아래에 적으면 이 날짜에 저장돼요';
    }
  }

  function lastPendingBefore(d) {
    var keys = Object.keys(store.tasks).filter(function (k) {
      return k < d && store.tasks[k].some(function (t) { return !t.done; });
    }).sort();
    return keys.length ? keys[keys.length - 1] : null;
  }

  function renderCarry() {
    var src = lastPendingBefore(view);
    if (!src) { el.carry.hidden = true; return; }
    var n = tasksOf(src).filter(function (t) { return !t.done; }).length;
    var label = src === shift(view, -1) ? '어제' : mdLabel(src);
    el.carryText.innerHTML = label + ' 못 끝낸 할 일 <b>' + n + '개</b>';
    el.carryBtn.textContent = view === todayISO() ? '오늘로 가져오기' : '여기로 가져오기';
    el.carry.dataset.src = src;
    el.carry.hidden = false;
  }

  function renderAll() {
    renderHeader();
    renderProgress();
    renderList();
    renderCarry();
  }

  /* ── actions ── */
  function addTask(text) {
    var v = (text || '').trim();
    if (!v) return false;
    var t = { id: uid(), text: v, done: false, doneAt: null, createdAt: Date.now() };
    ensure(view).push(t);
    newIds[t.id] = true;
    save();
    renderProgress();
    renderList();
    renderCarry();
    scrollToTask(t.id);
    return true;
  }

  function scrollToTask(id) {
    var li = el.list.querySelector('.task[data-id="' + id + '"]');
    if (!li) return;
    try { li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { li.scrollIntoView(false); }
  }

  function toggle(id) {
    var list = tasksOf(view), t = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) t = list[i];
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    save();

    var li = el.list.querySelector('.task[data-id="' + id + '"]');
    if (li) {
      li.classList.toggle('done', t.done);
      var chk = li.querySelector('.check');
      if (chk) chk.setAttribute('aria-checked', t.done ? 'true' : 'false');
    }
    renderProgress();
    renderCarry();
    clearTimeout(reorderTimer);
    reorderTimer = setTimeout(function () {
      if (editingId) return;
      renderList();
      renderProgress();
    }, 320);
  }

  function removeTask(id) {
    var list = tasksOf(view), idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) idx = i;
    if (idx < 0) return;
    var removed = list.splice(idx, 1)[0];
    if (!list.length) delete store.tasks[view];
    save();
    renderList();
    renderProgress();
    renderCarry();
    toast('삭제했어요', function () {
      var l = ensure(view);
      l.splice(Math.min(idx, l.length), 0, removed);
      save();
      renderList();
      renderProgress();
      renderCarry();
    });
  }

  function startEdit(id) {
    editingId = id;
    renderList();
    var inp = el.list.querySelector('.edit-input');
    if (inp) {
      inp.focus();
      var n = inp.value.length;
      try { inp.setSelectionRange(n, n); } catch (e) { /* iOS sometimes throws */ }
    }
  }

  function commitEdit(value) {
    if (!editingId) return;
    var id = editingId;
    editingId = null;
    var list = tasksOf(view), t = null, idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { t = list[i]; idx = i; }
    var v = (value || '').trim();
    if (t) {
      if (!v) {
        list.splice(idx, 1);
        if (!list.length) delete store.tasks[view];
      } else {
        t.text = v;
      }
    }
    save();
    renderList();
    renderProgress();
    renderCarry();
  }

  function carryOver(src) {
    if (!src || src === view) return;
    var pending = tasksOf(src).filter(function (t) { return !t.done; });
    if (!pending.length) { renderCarry(); return; }

    var target = ensure(view);
    var have = Object.create(null);
    target.forEach(function (t) { have[t.text.trim()] = true; });

    var added = [], moved = [];
    pending.forEach(function (t) {
      var key = t.text.trim();
      if (have[key]) return;
      have[key] = true;
      var item = { id: uid(), text: t.text, done: false, doneAt: null, createdAt: Date.now() };
      target.push(item);
      added.push(item);
      moved.push(t);
    });

    store.tasks[src] = tasksOf(src).filter(function (t) { return moved.indexOf(t) < 0; });
    if (!store.tasks[src].length) delete store.tasks[src];

    save();
    renderList();
    renderProgress();
    renderCarry();

    if (!added.length) { toast('이미 오늘 목록에 있어요', null); return; }
    toast(added.length + '개를 가져왔어요', function () {
      var tl = tasksOf(view).filter(function (t) { return added.indexOf(t) < 0; });
      if (tl.length) store.tasks[view] = tl; else delete store.tasks[view];
      var back = ensure(src);
      moved.forEach(function (t) { if (back.indexOf(t) < 0) back.push(t); });
      save();
      renderList();
      renderProgress();
      renderCarry();
    });
  }

  /* ── toast ── */
  function toast(msg, fn) {
    el.toastMsg.textContent = msg;
    undoCb = fn || null;
    el.undo.hidden = !fn;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, fn ? 5000 : 2400);
  }
  function hideToast() {
    el.toast.classList.remove('show');
    el.undo.hidden = true;
    undoCb = null;
  }
  el.undo.addEventListener('click', function () {
    var fn = undoCb;
    hideToast();
    if (fn) { clearTimeout(toastTimer); fn(); }
  });

  /* ── events ── */
  el.list.addEventListener('click', function (e) {
    var li = e.target.closest ? e.target.closest('.task') : null;
    if (!li) return;
    var id = li.dataset.id;
    var btn = e.target.closest('button');
    if (btn) {
      if (btn.classList.contains('check')) { toggle(id); return; }
      if (btn.classList.contains('del')) { removeTask(id); return; }
      if (btn.classList.contains('edit')) { startEdit(id); return; }
      return;
    }
    if (e.target.closest('.task-text')) toggle(id);
  });

  el.list.addEventListener('keydown', function (e) {
    var inp = e.target;
    if (!inp.classList || !inp.classList.contains('edit-input')) return;
    if (e.key === 'Enter' && !e.isComposing && !composing) {
      e.preventDefault();
      commitEdit(inp.value);
    } else if (e.key === 'Escape') {
      editingId = null;
      renderList();
    }
  });

  el.list.addEventListener('focusout', function (e) {
    var inp = e.target;
    if (!inp.classList || !inp.classList.contains('edit-input')) return;
    if (editingId) commitEdit(inp.value);
  });

  el.prev.addEventListener('click', function () {
    editingId = null;
    view = shift(view, -1);
    el.scroll.scrollTop = 0;
    renderAll();
  });
  el.next.addEventListener('click', function () {
    editingId = null;
    view = shift(view, 1);
    el.scroll.scrollTop = 0;
    renderAll();
  });
  el.today.addEventListener('click', function () {
    if (view === todayISO()) return;
    editingId = null;
    view = todayISO();
    el.scroll.scrollTop = 0;
    renderAll();
  });
  el.picker.addEventListener('change', function () {
    if (!el.picker.value) return;
    editingId = null;
    view = el.picker.value;
    el.scroll.scrollTop = 0;
    renderAll();
  });

  el.carryBtn.addEventListener('click', function () {
    carryOver(el.carry.dataset.src);
  });

  function submitAdd() {
    if (composing) return;
    if (addTask(el.input.value)) el.input.value = '';
    else el.input.focus();
  }
  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    submitAdd();
  });
  el.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing && !composing) {
      e.preventDefault();
      submitAdd();
    }
  });
  el.input.addEventListener('compositionstart', function () { composing = true; });
  el.input.addEventListener('compositionend', function () { composing = false; });

  /* ── viewport (iOS keyboard / toolbar) ── */
  function syncViewport() {
    var vv = window.visualViewport;
    if (!vv) return;
    var root = document.documentElement.style;
    root.setProperty('--app-h', Math.round(vv.height) + 'px');
    root.setProperty('--app-top', Math.max(0, Math.round(vv.offsetTop)) + 'px');
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
  }
  window.addEventListener('resize', syncViewport);
  window.addEventListener('orientationchange', function () { setTimeout(syncViewport, 250); });

  /* ── keep "오늘" fresh if the app stays open past midnight ── */
  var openDay = todayISO();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var now = todayISO();
    if (now !== openDay) {
      var wasToday = view === openDay;
      openDay = now;
      if (wasToday) { view = now; el.scroll.scrollTop = 0; }
      renderAll();
    }
  });

  /* ── boot ── */
  load();
  if (el.picker.value !== view) el.picker.value = view;
  renderAll();
  syncViewport();
})();
</script>
</body>
</html>
